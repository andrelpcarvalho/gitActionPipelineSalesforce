###############################################################################
# Deploy PRD
#
# Gatilho: Push na branch main (após merge da release branch)
# Objetivo: Deployar o código em produção, gerar ZIP do build e publicar
#           uma GitHub Release versionada para rastreabilidade e rollback.
#
# Pré-requisitos:
#   - Secret SF_PRD_AUTH_URL com a SFDX Auth URL da org PRD
#   - Environment "PRD" configurado no GitHub com aprovadores
#   - Todas as validações anteriores devem ter passado nos PRs individuais:
#     * CI (dry-run org CI)
#     * 2 code reviews por PR
#     * Deploy UAT bem-sucedido por squad
#     * GMUD aprovada por PR
#   - Release branch mergeada na main pelo Release Manager
#
# Artefatos gerados a cada deploy bem-sucedido:
#   - Git tag: v{YYYY}.{MM}.{DD}-{HHmm}  (ex: v2026.06.10-1430)
#   - ZIP: force-app-v{YYYY}.{MM}.{DD}-{HHmm}.zip
#   - GitHub Release: tag acima com o ZIP como asset para download/Spinnaker
###############################################################################

name: Deploy PRD

on:
  push:
    branches: [main]
    paths:
      - 'force-app/**'

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # -----------------------------------------------------------------------
    # Environment PRD com aprovadores
    # Configure em: Settings > Environments > PRD > Required reviewers
    # -----------------------------------------------------------------------
    environment: PRD

    steps:
      # -----------------------------------------------------------------
      # 1. Checkout do código (main após merge da release branch)
      # -----------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # 2. Definir versão/tag baseada na data de execução
      #    Formato: v{YYYY}.{MM}.{DD}-{HHmm}  ex: v2026.06.10-1430
      #    Exportada como TAG_NAME para todos os steps seguintes
      # -----------------------------------------------------------------
      - name: Set release version
        id: version
        run: |
          TAG_NAME="v$(date -u '+%Y.%m.%d-%H%M')"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Versão desta release: $TAG_NAME"

      # -----------------------------------------------------------------
      # 3. Extrair informações do merge da release branch
      # -----------------------------------------------------------------
      - name: Extract release info
        id: info
        run: |
          COMMIT_MSG=$(git log -1 --format="%s")
          echo "Commit: $COMMIT_MSG"

          PR_NUM=$(echo "$COMMIT_MSG" | grep -oP '#\K[0-9]+' || echo "unknown")

          if [ "$PR_NUM" != "unknown" ]; then
            PR_TITLE=$(gh pr view "$PR_NUM" \
              --repo ${{ github.repository }} \
              --json title -q '.title' 2>/dev/null || echo "$COMMIT_MSG")
            MERGED_BY=$(gh pr view "$PR_NUM" \
              --repo ${{ github.repository }} \
              --json mergedBy -q '.mergedBy.login' 2>/dev/null || echo "unknown")

            RELEASE_BRANCH=$(gh pr view "$PR_NUM" \
              --repo ${{ github.repository }} \
              --json headRefName -q '.headRefName' 2>/dev/null || echo "unknown")

            if [ "$RELEASE_BRANCH" != "unknown" ]; then
              GMUDS=$(gh pr list \
                --repo ${{ github.repository }} \
                --base "$RELEASE_BRANCH" \
                --state merged \
                --json labels \
                --jq '.[].labels[].name' 2>/dev/null | grep -oP 'GMUD-\d+' | sort -u || echo "SEM-GMUD")

              PR_COUNT=$(gh pr list \
                --repo ${{ github.repository }} \
                --base "$RELEASE_BRANCH" \
                --state merged \
                --json number \
                --jq 'length' 2>/dev/null || echo "0")
            else
              GMUDS="SEM-GMUD"
              PR_COUNT="0"
            fi
          else
            PR_TITLE="$COMMIT_MSG"
            MERGED_BY="unknown"
            RELEASE_BRANCH="unknown"
            GMUDS="SEM-GMUD"
            PR_COUNT="0"
          fi

          echo "pr_num=$PR_NUM"             >> "$GITHUB_OUTPUT"
          echo "pr_title=$PR_TITLE"         >> "$GITHUB_OUTPUT"
          echo "merged_by=$MERGED_BY"       >> "$GITHUB_OUTPUT"
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_count=$PR_COUNT"         >> "$GITHUB_OUTPUT"
          echo "gmuds<<EOF"                 >> "$GITHUB_OUTPUT"
          echo "$GMUDS"                     >> "$GITHUB_OUTPUT"
          echo "EOF"                        >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Versão  : ${{ steps.version.outputs.tag_name }}"
          echo "Release : $RELEASE_BRANCH"
          echo "PR      : #$PR_NUM - $PR_TITLE"
          echo "Merge por: $MERGED_BY"
          echo "PRs incluídos: $PR_COUNT"
          echo "GMUDs   : $GMUDS"
          echo "========================================"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # 4. Instalar Salesforce CLI
      # -----------------------------------------------------------------
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # -----------------------------------------------------------------
      # 5. Autenticar na org PRD
      # -----------------------------------------------------------------
      - name: Authenticate PRD Org
        run: |
          echo "${{ secrets.SF_PRD_AUTH_URL }}" > auth.url
          sf org login sfdx-url --sfdx-url-file auth.url --alias prd-org
          rm -f auth.url

      # -----------------------------------------------------------------
      # 6. Validate (dry-run) em PRD com testes completos
      # -----------------------------------------------------------------
      - name: Validate in PRD (Dry Run)
        run: |
          echo "Iniciando validação em PRD..."
          sf project deploy validate \
            --source-dir force-app \
            --target-org prd-org \
            --test-level RunLocalTests \
            --wait 120

      # -----------------------------------------------------------------
      # 7. Deploy real (quick deploy via resultado da validação)
      # -----------------------------------------------------------------
      - name: Deploy to PRD (Quick Deploy)
        run: |
          echo "Validação OK. Executando quick deploy..."
          sf project deploy quick \
            --target-org prd-org \
            --use-most-recent

      # -----------------------------------------------------------------
      # 8. Gerar ZIP do build validado
      #    O ZIP contém todo o force-app e é nomeado com a versão,
      #    garantindo rastreabilidade 1:1 entre artefato e deploy.
      # -----------------------------------------------------------------
      - name: Package build artifact (ZIP)
        if: success()
        id: zip
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          ZIP_NAME="force-app-${TAG_NAME}.zip"

          zip -r "$ZIP_NAME" force-app/
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "ZIP gerado: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"

      # -----------------------------------------------------------------
      # 9. Criar git tag anotada com metadados completos do deploy
      # -----------------------------------------------------------------
      - name: Tag successful deploy
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          GMUDS="${{ steps.info.outputs.gmuds }}"

          git tag -a "$TAG_NAME" -m "PRD Deploy $TAG_NAME
Release  : ${{ steps.info.outputs.release_branch }}
PR       : #${{ steps.info.outputs.pr_num }} - ${{ steps.info.outputs.pr_title }}
Aprovado : ${{ steps.info.outputs.merged_by }}
PRs      : ${{ steps.info.outputs.pr_count }}
GMUDs    : $GMUDS
Data UTC : $(date -u '+%Y-%m-%d %H:%M:%S')"

          git push origin "$TAG_NAME"
          echo "Tag criada: $TAG_NAME"

      # -----------------------------------------------------------------
      # 10. Publicar GitHub Release com o ZIP como asset
      #     A release fica disponível em:
      #       github.com/{owner}/{repo}/releases/tag/{TAG_NAME}
      #     O ZIP pode ser baixado por Spinnaker ou qualquer CI/CD externo
      #     via URL estável:
      #       github.com/{owner}/{repo}/releases/download/{TAG_NAME}/{ZIP_NAME}
      # -----------------------------------------------------------------
      - name: Publish GitHub Release
        if: success()
        run: |
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          GMUDS="${{ steps.info.outputs.gmuds }}"

          gh release create "$TAG_NAME" \
            "$ZIP_NAME" \
            --title "Deploy PRD $TAG_NAME" \
            --notes "## Deploy PRD $TAG_NAME

| Campo | Valor |
|-------|-------|
| Release branch | \`${{ steps.info.outputs.release_branch }}\` |
| PR | #${{ steps.info.outputs.pr_num }} — ${{ steps.info.outputs.pr_title }} |
| Aprovado por | @${{ steps.info.outputs.merged_by }} |
| PRs incluídos | ${{ steps.info.outputs.pr_count }} |
| GMUDs | $GMUDS |
| Data UTC | $(date -u '+%Y-%m-%d %H:%M:%S') |

### Artefato
\`$ZIP_NAME\` — build completo do \`force-app/\` deployado nesta versão.

> Para rollback, use o workflow **Rollback PRD** informando a tag \`$TAG_NAME\` ou quantas versões deseja voltar."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # 11. Comentar no PR da release branch
      # -----------------------------------------------------------------
      - name: Comment deploy result on PR
        if: always()
        run: |
          PR_NUM="${{ steps.info.outputs.pr_num }}"
          if [ "$PR_NUM" == "unknown" ]; then exit 0; fi

          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          GMUDS="${{ steps.info.outputs.gmuds }}"

          if [ "${{ job.status }}" == "success" ]; then
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            gh pr comment "$PR_NUM" \
              --repo ${{ github.repository }} \
              --body "🚀 **Deploy PRD realizado com sucesso!**

| Item | Detalhe |
|------|---------|
| Versão | [\`$TAG_NAME\`]($RELEASE_URL) |
| Release | \`${{ steps.info.outputs.release_branch }}\` |
| Aprovado por | @${{ steps.info.outputs.merged_by }} |
| PRs incluídos | ${{ steps.info.outputs.pr_count }} |
| GMUDs | $GMUDS |
| Data UTC | $(date -u '+%Y-%m-%d %H:%M:%S') |

📦 [Baixar artefato do build]($RELEASE_URL)"
          else
            gh pr comment "$PR_NUM" \
              --repo ${{ github.repository }} \
              --body "❌ **Deploy PRD falhou.**

Release: \`${{ steps.info.outputs.release_branch }}\`
GMUDs: $GMUDS

Verifique os logs do workflow. Se necessário, execute o **Rollback PRD**."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
